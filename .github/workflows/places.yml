name: Update nearby places

on:
  push:
    branches: [main]
    paths:
      - listings.json
      - scripts/fetch-places.mjs
      - .github/workflows/places.yml
  schedule:
    - cron: '17 11 * * 1'   # Mondays, ~3–4am Portland time
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: places
  cancel-in-progress: true

jobs:
  places:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect places from OpenStreetMap
        run: node scripts/fetch-places.mjs
      - name: Commit places.json if it changed
        run: |
          if [ -n "$(git status --porcelain places.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add places.json
            git commit -m "Update nearby places"
            git pull --rebase origin main
            git push
          else
            echo "places.json unchanged"
          fi
