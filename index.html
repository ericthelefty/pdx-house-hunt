<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDX House Hunt</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><h1>PDX House Hunt</h1><span id="updated" class="muted"></span></div>
  <div class="criteria" id="criteria"></div>
</header>
<div class="controls">
  <select id="fSource" aria-label="Source"><option value="">All sources</option><option>Craigslist</option><option>Zillow</option></select>
  <select id="fStatus" aria-label="Status"><option value="">Any status</option><option value="new">New</option><option value="interested">Interested</option><option value="contacted">Contacted</option><option value="toured">Toured</option><option value="pass">Pass</option></select>
  <select id="sort" aria-label="Sort"><option value="newest">Newest</option><option value="price">Price ↑</option><option value="priceDesc">Price ↓</option><option value="beds">Most beds</option></select>
  <label><input type="checkbox" id="fMatch"> Confirmed yard + dishwasher</label>
  <label><input type="checkbox" id="fBath"> 1.5+ baths</label>
  <label><input type="checkbox" id="fPass"> Show passed</label>
  <span id="count" class="muted count"></span>
  <div class="tabs"><button data-view="list" class="on">List</button><button data-view="map">Map</button></div>
</div>
<main class="split" id="split">
  <section class="list" id="list"></section>
  <section class="mapwrap">
    <div id="map"></div>
    <div class="layers" id="layers">
      <div class="layers-title">Nearby</div>
      <label><input type="checkbox" data-poi="grocery"><span class="dot grocery"></span>Groceries</label>
      <label><input type="checkbox" data-poi="park"><span class="dot park"></span>Parks</label>
      <label><input type="checkbox" data-poi="coffee"><span class="dot coffee"></span>Coffee</label>
      <label><input type="checkbox" data-poi="bar"><span class="dot bar"></span>Bars &amp; pubs</label>
      <div class="hint" id="poiHint">Zoom in to load places</div>
    </div>
  </section>
</main>
<footer class="foot">Click a house to see its 10-minute walk and nearest groceries, parks, coffee and bars. · Statuses are saved on this device only. · Nearby places are a weekly snapshot. · Map © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
